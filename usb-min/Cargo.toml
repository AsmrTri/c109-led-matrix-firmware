[package]
name = "usb-min"
version = "0.1.0"
edition = "2024"
publish = false

# ほかのワークスペースに取り込まれないよう、この crate だけで閉じる
[workspace]

[dependencies]
# ch32-hal は、上流の 71a2985 の写し (`../vendor/ch32-hal`) に、CH32V203RBT6 でビルドが通るための直しを入れたもの
# (`../vendor/README.md`)。Cargo.lock があるので、一度 cargo fetch をすれば --offline でビルドできる。
# 機能: タイマーの時間のドライバーは使わず、時間は SysTick を読むだけ (time-driver-* を付けないと SysTick になる)
ch32-hal = { path = "../vendor/ch32-hal", default-features = false, features = [
    "ch32v203rbt6",
    "memory-x",
    "rt",
    "embassy",
] }
qingke = "0.7"
qingke-rt = "0.7"
panic-halt = "1.0"
embassy-time = "0.5.1"
embassy-usb = { version = "0.5.1", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
strip = false          # 記号は書き込まれないので残す
lto = true
opt-level = "z"        # 大きさを小さく
panic = "abort"
overflow-checks = true # 整数のあふれを、リリースでも止める
